name: Send News Bot

on:
  schedule:
    - cron: "0 7 * * *"   # ۰۹:۰۰ سوئد (تابستان: ۰۸:۰۰ UTC)
    - cron: "0 10 * * *"  # ۱۲:۰۰ سوئد (تابستان: ۱۰:۰۰ UTC)
    - cron: "0 13 * * *"  # ۱۵:۰۰ سوئد (تابستان: ۱۳:۰۰ UTC)
    - cron: "0 16 * * *"  # ۱۸:۰۰ سوئد (تابستان: ۱۶:۰۰ UTC)
    - cron: "0 19 * * *"  # ۲۱:۰۰ سوئد (تابستان: ۱۹:۰۰ UTC)
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install requests
        pip install feedparser
        
    - name: Run bot
      run: python bot.py
